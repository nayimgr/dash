<div id="app"></div>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>

<script src="../shared/core.js?v=20260928-1000"></script>
<script>
// Structure only — see the note in the sibling dashboard.

DashCore.start({
  id:          "train",
  title:       "train",
  briefPath:   "brief/today.json",
  changesPath: "brief/today_changes.json",
  rebuild:     "build-brief.yml",   // dispatched when the brief is from yesterday
  dateField:   { default:"Do on", person:"Next contact" },
  compactCards: true,               // done + title + date; the rest behind "⋯"

  blocks: [
    { kind:"session",   id:"session",  label:"Today" },
    { kind:"heatmap",   id:"history",  label:"History" },
    { kind:"checks",    id:"checks",   label:"Daily" },
    { kind:"log",       id:"log",      label:"Log" },
    { kind:"metrics",   id:"metrics",  label:"Benchmarks" },
    { kind:"projects",  id:"goals",    label:"Goals" },
    { kind:"items",     id:"tasks",    label:"Tasks", allowNew:true },
    { kind:"upload",    id:"upload",   label:"Import" },
    { kind:"recent",    id:"recent",   label:"Recent", limit:30 },
    { kind:"braindump", id:"notes",    label:"Notes" }
  ]
});
</script>
