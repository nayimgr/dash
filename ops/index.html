<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="theme-color" content="#141412" media="(prefers-color-scheme: dark)">

<title>ops</title>
<link rel="icon" type="image/svg+xml" href="../icons/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../icons/icon-32.png">
<link rel="apple-touch-icon" href="../icons/icon-180.png">

<body>
<div id="app"></div>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>

<script src="../shared/core.js?v=20260928-1000"></script>
<script>
// Structure only. Every label, topic, prompt and colour assignment comes from
// the brief, which lives in a private repository — so this file says what the
// blocks ARE without saying what they are FOR.
//
// A block claims the items whose `group` matches its `id`.

DashCore.start({
  id:          "ops",
  title:       "ops",
  briefPath:   "brief/ops/today.json",
  changesPath: "brief/ops/today_changes.json",
  rebuild:     "build-brief.yml",   // dispatched when the brief is from yesterday
  dateField:   { default:"Reminder", person:"Next contact" },
  subtasks:    false,               // notes inside a task, not a hierarchy
  compactCards: true,               // done + title + date; the rest behind "⋯"

  blocks: [
    { kind:"items",     id:"focus",    label:"Focus",    allowNew:true },
    { kind:"items",     id:"tasks",    label:"Tasks",    allowNew:true },
    { kind:"items",     id:"personal", label:"Personal", allowNew:true },
    { kind:"projects",  id:"projects", label:"Projects" },
    { kind:"items",     id:"people",   label:"People" },
    { kind:"reading",   id:"reading",  label:"Reading" },
    { kind:"items",     id:"readlist", label:"List",     allowNew:true, undated:true, count:true },
    { kind:"items",     id:"someday",  label:"Later",    allowNew:true, undated:true, count:true, collapsed:true },
    { kind:"recent",    id:"recent",   label:"Recently done", limit:40 },
    { kind:"inbox",     id:"inbox",    label:"Inbox" },
    { kind:"braindump", id:"notes",    label:"Notes" }
  ]
});
</script>
</body>
</html>
