<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F7F6F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141412" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="dashboards">
<meta name="robots" content="noindex, nofollow">
<title>dashboards</title>
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="shared/style.css?v=20260928-1200">
</head>
<body>
<div class="hub" id="hub"></div>

<script>
// A name and a link. What each one is for is not this page's business — and
// this page is public.
const DASHBOARDS = [
  { id:"ops",   name:"ops",   path:"ops/",   color:"#2563EB", icon:"◧" },
  { id:"train", name:"train", path:"train/", color:"#16A34A", icon:"◔" }
];

document.getElementById("hub").innerHTML =
  "<h1>dashboards</h1><div class='sub'>"
  + new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"})
  + "</div>"
  + DASHBOARDS.map(function(d){
      return "<a class='hub-item' href='" + d.path + "'>"
        + "<div class='hub-ic' style=\"background:" + d.color + "1a;color:" + d.color + "\">" + d.icon + "</div>"
        + "<div class='hub-t'><div class='hub-n'>" + d.name + "</div></div></a>";
    }).join("");
</script>
</body>
</html>
